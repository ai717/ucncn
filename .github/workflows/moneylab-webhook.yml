name: MoneyLab Cloud Ingest (云端自动入库与发布)

on:
  repository_dispatch:
    types: [moneylab_ingest]
  workflow_dispatch:
    inputs:
      json_data:
        description: '粘贴搞钱项目 JSON 数组'
        required: true
        default: '[]'

permissions:
  contents: write

jobs:
  cloud_ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse and ingest data
        id: ingest
        run: |
          mkdir -p /tmp/moneylab

          # 提取数据
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJson(github.event.client_payload.projects) }}' > /tmp/moneylab/incoming.json
          else
            echo '${{ github.event.inputs.json_data }}' > /tmp/moneylab/incoming.json
          fi

          echo "📦 正在执行云端入库与去重校验..."
          node money/scripts/ingest.js --file=/tmp/moneylab/incoming.json

      - name: Commit and push changes
        id: git_commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet money/data/projects.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "💡 数据未发生变化，无需提交。"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git add money/data/projects.json
            git commit -m "chore(money): auto-ingest new projects via cloud webhook"
            git pull --rebase origin main
            git push origin main
            echo "✅ 云端代码合并成功！"
          fi

      - name: Sync updated data directly to VPS
        if: steps.git_commit.outputs.has_changes == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "🚀 正在将最新 projects.json 直传 VPS..."
          scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_rsa money/data/projects.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/www/wwwroot/ucncn.cn/money/data/projects.json

          echo "✅ 搞钱实验室 (ucncn.cn/money) 线上已实时更新生效！"
