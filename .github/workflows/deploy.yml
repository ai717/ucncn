name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'money/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files directly to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "🚀 打包最新静态资源并直传 VPS (/www/wwwroot/ucncn.cn)..."
          tar --exclude='.git' --exclude='.github' -czf /tmp/site_deploy.tar.gz .

          scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_rsa /tmp/site_deploy.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/site_deploy.tar.gz

          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /www/wwwroot/ucncn.cn && tar -xzf /tmp/site_deploy.tar.gz -C /www/wwwroot/ucncn.cn && rm -f /tmp/site_deploy.tar.gz"

          echo "✅ 菜鸟笔记 (ucncn.cn) 线上已同步至最新代码！"
