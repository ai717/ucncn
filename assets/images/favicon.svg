<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 笔记本内页渐变 -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- 极光金点缀 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- 柔和投影 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外轮廓圆角背景 -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- 细腻边框内发光 -->
  <rect x="6.5" y="6.5" width="115" height="115" rx="29.5" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 笔记展开页与极客代码折叠造型 -->
  <g transform="translate(24, 22)">
    <!-- 笔记本底层硬壳质感 -->
    <rect x="4" y="6" width="72" height="74" rx="8" fill="#1e293b" opacity="0.6"/>

    <!-- 笔记本主体封面 (白/浅灰高光卡片) -->
    <rect x="0" y="0" width="74" height="76" rx="10" fill="url(#pageGrad)"/>
    
    <!-- 侧边书脊装饰线条 (装订线) -->
    <rect x="0" y="0" width="14" height="76" rx="6" fill="#cbd5e1"/>
    <circle cx="7" cy="18" r="2.5" fill="#94a3b8"/>
    <circle cx="7" cy="38" r="2.5" fill="#94a3b8"/>
    <circle cx="7" cy="58" r="2.5" fill="#94a3b8"/>

    <!-- 代码行极简刻线 -->
    <rect x="22" y="16" width="42" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="22" y="27" width="32" height="5" rx="2.5" fill="#cbd5e1"/>

    <!-- 动态闪电 / 灵感代码光芒 (极客符号) -->
    <path d="M48 38 L34 56 L44 56 L38 74 L58 52 L48 52 Z" fill="url(#goldGrad)" />
  </g>
</svg>
