<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#111d40"/>
      <stop offset="100%" stop-color="#1a2b4c"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 光晕点缀 -->
  <circle cx="1050" cy="150" r="240" fill="#2563eb" opacity="0.25" filter="url(#glowEffect)"/>
  <circle cx="150" cy="500" r="200" fill="#06b6d4" opacity="0.2" filter="url(#glowEffect)"/>

  <!-- 边框卡片 -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 顶部徽标 -->
  <g transform="translate(90, 80)">
    <rect width="320" height="42" rx="21" fill="rgba(37, 99, 235, 0.2)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="20" y="27" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="16" font-weight="700">⚡ UCNCN.CN · 开发者技术手记</text>
  </g>

  <!-- 主标题 -->
  <g transform="translate(90, 210)">
    <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="60" font-weight="800" letter-spacing="-1">菜鸟笔记</text>
    <text x="270" y="-8" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="36" font-weight="600">· 极客与开发者备忘录</text>
  </g>

  <!-- 副标题描述 -->
  <g transform="translate(90, 290)">
    <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="24" font-weight="500">记录计算机编程、Linux 系统运维、实用脚本与现代 Web 开发经验</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20">纯静态高安全架构 · 零第三方追踪 · 坚持持续记录与复盘</text>
  </g>

  <!-- 分割线 -->
  <line x1="90" y1="400" x2="1110" y2="400" stroke="#334155" stroke-width="2"/>

  <!-- 标签栏 -->
  <g transform="translate(90, 440)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="180" height="46" rx="12" fill="rgba(30, 58, 138, 0.4)" stroke="#60a5fa" stroke-width="1"/>
    <text x="24" y="29" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="600">🐧 Linux 运维</text>

    <!-- Tag 2 -->
    <rect x="204" y="0" width="180" height="46" rx="12" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="228" y="29" fill="#6ee7b7" font-family="sans-serif" font-size="16" font-weight="600">🌐 现代前端</text>

    <!-- Tag 3 -->
    <rect x="408" y="0" width="180" height="46" rx="12" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
    <text x="424" y="29" fill="#fde047" font-family="sans-serif" font-size="16" font-weight="600">🐍 Python 自动化</text>

    <!-- Tag 4 -->
    <rect x="612" y="0" width="180" height="46" rx="12" fill="rgba(88, 28, 135, 0.4)" stroke="#c084fc" stroke-width="1"/>
    <text x="632" y="29" fill="#e9d5ff" font-family="sans-serif" font-size="16" font-weight="600">🌿 Git 工作流</text>

    <!-- Tag 5 -->
    <rect x="816" y="0" width="180" height="46" rx="12" fill="rgba(15, 76, 92, 0.4)" stroke="#38bdf8" stroke-width="1"/>
    <text x="836" y="29" fill="#bae6fd" font-family="sans-serif" font-size="16" font-weight="600">🧪 项目实验室</text>
  </g>

  <!-- 底部域名与备案声明 -->
  <g transform="translate(90, 550)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">https://ucncn.cn  ·  苏ICP备2024150485号-5  ·  个人技术笔记</text>
  </g>
</svg>
